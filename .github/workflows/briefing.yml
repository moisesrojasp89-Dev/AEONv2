name: AEON Daily Macro Briefing AI

on:
  schedule:
    # ☕ Sesión Pre-Londres: 06:00 UTC (Lunes a Viernes)
    - cron: '0 6 * * 1-5'
    
    # 🗽 Sesión Pre-Nueva York: 12:30 UTC (Lunes a Viernes)
    - cron: '30 12 * * 1-5'
    
  # Permite disparo manual con 1 clic para testing
  workflow_dispatch:
    inputs:
      session:
        description: 'Sesión a generar (auto / london_pre / ny_pre)'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - london_pre
          - ny_pre

jobs:
  generate-briefing:
    name: Generate Institutional Macro Briefing
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar Dependencias
        run: |
          pip install requests python-dotenv

      - name: Ejecutar Agente de Briefing (Gemini 2.5 Flash)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python scripts/ai/briefing_agent.py --session "${{ github.event.inputs.session || 'auto' }}"
