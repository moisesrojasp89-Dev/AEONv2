<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AEON | Nueva Contraseña</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="/src/css/variables.css">
  <link rel="stylesheet" href="/src/css/reset.css">
  <link rel="stylesheet" href="/src/css/layout.css">
  <link rel="stylesheet" href="/src/css/components/buttons.css">
  <link rel="stylesheet" href="/src/css/auth.css">
</head>
<body class="auth-body">

  <div class="auth-container">
    <header class="auth-header">
      <a href="/index.html" class="logo" aria-label="Volver a Inicio">AEON</a>
      <h1>Nueva Contraseña</h1>
      <p>Establece tu nueva clave de acceso seguro.</p>
    </header>

    <form id="update-password-form" class="auth-form" novalidate>
      <div id="auth-error" class="auth-error" role="alert" aria-live="assertive" hidden></div>
      <div id="auth-success" class="auth-success" role="status" aria-live="polite" hidden></div>
      
      <div class="form-group">
        <label for="new-password">Nueva Contraseña</label>
        <input type="password" id="new-password" name="new-password" placeholder="Mínimo 8 caracteres" minlength="8" required autocomplete="new-password">
      </div>

      <div class="form-group">
        <label for="confirm-new-password">Confirmar Nueva Contraseña</label>
        <input type="password" id="confirm-new-password" name="confirm-new-password" placeholder="Repite tu nueva contraseña" minlength="8" required autocomplete="new-password">
      </div>
      
      <button type="submit" id="btn-update-password" class="btn btn-primary btn-block">Actualizar Contraseña</button>
    </form>

    <div class="auth-footer">
      <p><a href="/login.html">Ir a Iniciar Sesión</a></p>
    </div>
  </div>

  <script type="module" src="/src/js/auth.js"></script>
</body>
</html>
