<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>AEON Admin — Pagos</title>
  <link rel="icon" href="/assets/favicon.ico" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background: #0a0e17;
      color: #e2e8f0;
      min-height: 100vh;
      padding: 1rem;
    }
    .admin-header {
      max-width: 700px;
      margin: 0 auto 1.5rem;
      text-align: center;
    }
    .admin-header h1 {
      font-size: 1.3rem;
      color: #38bdf8;
      margin-bottom: 0.25rem;
    }
    .admin-header p {
      font-size: 0.8rem;
      color: #64748b;
    }
    .admin-toolbar {
      max-width: 700px;
      margin: 0 auto 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
    }
    .admin-count {
      font-size: 0.85rem;
      color: #94a3b8;
    }
    .admin-count strong {
      color: #fbbf24;
      font-size: 1.2rem;
    }
    #admin-refresh {
      background: rgba(56, 189, 248, 0.1);
      border: 1px solid rgba(56, 189, 248, 0.3);
      color: #38bdf8;
      padding: 0.5rem 1rem;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.85rem;
    }
    #admin-refresh:active { transform: scale(0.97); }
    #admin-status {
      text-align: center;
      color: #64748b;
      font-size: 0.85rem;
      max-width: 700px;
      margin: 0 auto;
    }
    #admin-payments-list {
      max-width: 700px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    .admin-pay-card {
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 12px;
      overflow: hidden;
    }
    .admin-pay-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.75rem 1rem;
      background: rgba(255,255,255,0.03);
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }
    .admin-pay-order {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.9rem;
      color: #38bdf8;
      font-weight: 600;
    }
    .admin-pay-badge {
      font-size: 0.7rem;
      padding: 0.2rem 0.5rem;
      border-radius: 6px;
      background: rgba(251, 191, 36, 0.15);
      color: #fbbf24;
    }
    .admin-pay-body {
      padding: 0.75rem 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }
    .admin-pay-row {
      display: flex;
      justify-content: space-between;
      font-size: 0.8rem;
    }
    .admin-pay-row span { color: #64748b; }
    .admin-pay-row strong { color: #e2e8f0; text-align: right; }
    .admin-pay-actions {
      display: flex;
      gap: 0.5rem;
      padding: 0.75rem 1rem;
      border-top: 1px solid rgba(255,255,255,0.06);
    }
    .admin-btn {
      flex: 1;
      padding: 0.65rem;
      border: none;
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
    }
    .admin-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .admin-btn-approve {
      background: rgba(34, 197, 94, 0.15);
      color: #22c55e;
      border: 1px solid rgba(34, 197, 94, 0.3);
    }
    .admin-btn-reject {
      background: rgba(239, 68, 68, 0.1);
      color: #ef4444;
      border: 1px solid rgba(239, 68, 68, 0.2);
    }
    .admin-btn:active { transform: scale(0.97); }
    #admin-access-denied {
      display: none;
      text-align: center;
      padding: 4rem 1rem;
      color: #ef4444;
    }
    #admin-access-denied h2 { margin-bottom: 0.5rem; }
    .admin-back {
      display: block;
      text-align: center;
      margin-top: 2rem;
      color: #64748b;
      font-size: 0.8rem;
      text-decoration: none;
    }
    .admin-back:hover { color: #38bdf8; }
  </style>
</head>
<body>

  <div class="admin-header">
    <h1>⚡ AEON Admin — Pagos Cripto</h1>
    <p>Gestiona órdenes pendientes desde cualquier dispositivo</p>
  </div>

  <div id="admin-access-denied">
    <h2>🔒 Acceso Denegado</h2>
    <p>Tu cuenta no tiene permisos de administrador.</p>
    <a href="/perfil.html" class="admin-back">← Volver al Perfil</a>
  </div>

  <div id="admin-content" style="display: none;">
    <div class="admin-toolbar">
      <span class="admin-count">Pendientes: <strong id="admin-pending-count">0</strong></span>
      <button id="admin-refresh">🔄 Actualizar</button>
    </div>

    <p id="admin-status"></p>
    <div id="admin-payments-list"></div>

    <a href="/perfil.html" class="admin-back">← Volver al Perfil</a>
  </div>

  <script type="module" src="/src/js/admin-pagos.js"></script>
</body>
</html>
