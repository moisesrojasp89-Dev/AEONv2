<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calendario Económico | AEON</title>
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

  <!-- CSS -->
  <link rel="stylesheet" href="/src/css/variables.css" />
  <link rel="stylesheet" href="/src/css/reset.css" />
  <link rel="stylesheet" href="/src/css/layout.css" />
  <link rel="stylesheet" href="/src/css/animations.css" />
  <link rel="stylesheet" href="/src/css/components/buttons.css" />
  <link rel="stylesheet" href="/src/css/components/navbar.css" />
  <link rel="stylesheet" href="/src/css/components/form-controls.css" />
  <link rel="stylesheet" href="/src/css/components/sidebar-widget.css" />
  <link rel="stylesheet" href="/src/css/components/news.css" />
  <link rel="stylesheet" href="/src/css/components/calendar.css" />
  <link rel="stylesheet" href="/src/css/responsive.css" />
  <style>
    /* Critical CSS to prevent FOUC */
    body {
      background-color: #070b12;
      color: #E4E4E7;
      font-family: 'Inter', sans-serif;
      margin: 0;
      padding: 0;
    }
    .bg-mesh {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at 15% 50%, rgba(14, 165, 233, 0.08), transparent 25%),
                  radial-gradient(circle at 85% 30%, rgba(139, 92, 246, 0.08), transparent 25%);
      z-index: -1;
    }
  </style>
</head>
<body>

  <div class="bg-mesh"></div>

  <div id="navbar-root"></div>

  <main class="container calendar-layout" style="padding-top: 6rem; padding-bottom: 4rem;">
    <!-- Columna Izquierda: Calendario -->
    <div class="calendar-panel calendar-panel--highlighted">
      <!-- Radar Terminal Header -->
      <div class="eco-head-header">
        <div class="eco-head-title-group">
          <div class="eco-head-icon">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
              <line x1="16" y1="2" x2="16" y2="6"></line>
              <line x1="8" y1="2" x2="8" y2="6"></line>
              <line x1="3" y1="10" x2="21" y2="10"></line>
            </svg>
          </div>
          <div class="eco-head-text">
            <h2>Calendario Económico</h2>
          </div>
        </div>

        <div class="calendar-controls" style="display: flex; gap: 0.65rem; align-items: center; flex-wrap: wrap;">
          <input type="text" id="calendar-search-input" class="calendar-search-input" placeholder="Buscar (CPI, NFP, FED, PMI)..." aria-label="Buscar evento macro" />
          <select id="calendar-date-filter" class="calendar-select" aria-label="Filtrar por fecha">
            <option value="today">Hoy</option>
            <option value="week">Esta Semana</option>
            <option value="month" selected>Este Mes</option>
            <option value="all">Todo el Historial</option>
          </select>
          <select id="calendar-filter" class="calendar-select" aria-label="Filtrar por divisa">
            <option value="all" selected>Todas las Divisas</option>
            <option value="USD">🇺🇸 USD</option>
            <option value="EUR">🇪🇺 EUR</option>
            <option value="GBP">🇬🇧 GBP</option>
            <option value="JPY">🇯🇵 JPY</option>
            <option value="CAD">🇨🇦 CAD</option>
            <option value="AUD">🇦🇺 AUD</option>
            <option value="NZD">🇳🇿 NZD</option>
            <option value="CHF">🇨🇭 CHF</option>
          </select>
          <select id="calendar-impact-filter" class="calendar-select" aria-label="Filtrar por impacto">
            <option value="medium-high" selected>Alto + Medio</option>
            <option value="HIGH">Alto Impacto</option>
            <option value="MEDIUM">Medio Impacto</option>
          </select>
        </div>
      </div>

      <!-- Calendar Table -->
      <div class="eco-table">
        <div class="eco-header-row">
          <div>Hora</div>
          <div>Div</div>
          <div>Imp</div>
          <div>Evento</div>
          <div style="text-align: right;">Actual</div>
          <div style="text-align: right;">Cons</div>
          <div style="text-align: right;">Previo</div>
          <div></div>
        </div>
        <div id="calendar-feed">
          <!-- JS Render -->
        </div>
      </div>
    </div>

    <!-- Columna Derecha: Panel de Contexto (Sidebar) -->
    <aside class="calendar-sidebar">
      
      <!-- Widget: DXY Live -->
      <div class="sidebar-widget">
        <div class="widget-header">
          <h3 class="widget-title">Market Context (DXY)</h3>
          <span class="live-indicator">LIVE</span>
        </div>
        <div id="tv-dxy-widget" class="tv-container">
          <!-- TradingView JS Injection -->
        </div>
      </div>

      <!-- Widget: Próximo Catalizador -->
      <div class="sidebar-widget">
        <div class="widget-header">
          <h3 class="widget-title">Próximo Catalizador</h3>
        </div>
        <div class="catalyst-box">
          <span class="c-timer">Faltan 02h 45m</span>
          <h4 class="c-event">Nóminas No Agrícolas (NFP)</h4>
          <p class="c-desc">Alta probabilidad de spike bidireccional en apertura NY.</p>
        </div>
      </div>

    </aside>
  </main>

  <!-- JS Scripts -->
  <script type="module" src="/src/js/supabaseClient.js"></script>
  <script type="module" src="/src/js/calendar.js"></script>



</body>
</html>
