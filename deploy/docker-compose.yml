version: '3.8'

# ==============================================================================
# AEON Production VPS 24/7 Unified Stack
# Orquesta los 2 Daemons de Inteligencia Cuantitativa y Macro
# ==============================================================================

services:

  # 1. CALENDAR & NEWS WATCHER: Sincronización en vivo de noticias e impacto táctico
  aeon-calendar-watcher:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: aeon-calendar-watcher
    restart: always
    command: ["python", "scripts/ai/news_sync_agent.py"]
    environment:
      - TZ=UTC
      - PYTHONUNBUFFERED=1
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    logging:
      driver: "json-file"
      options:
        max-size: "15m"
        max-file: "3"
    networks:
      - aeon-vps-net

  # 2. MACRO AI ENGINE: Briefing dual de sesiones y catalizadores dinámicos
  aeon-macro-ai:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: aeon-macro-ai
    restart: always
    command: ["python", "scripts/ai/briefing_agent.py"]
    environment:
      - TZ=UTC
      - PYTHONUNBUFFERED=1
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    logging:
      driver: "json-file"
      options:
        max-size: "15m"
        max-file: "3"
    networks:
      - aeon-vps-net

networks:
  aeon-vps-net:
    driver: bridge

