version: '3.8'

services:
  aeon-trade-watcher:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: aeon-trade-watcher-daemon
    restart: always
    environment:
      - TZ=UTC
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - MT5_SERVER_HOST=127.0.0.1
      - MT5_SERVER_PORT=5555
    volumes:
      - aeon_state_data:/opt/aeon/data
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    networks:
      - aeon-quant-net

volumes:
  aeon_state_data:
    driver: local

networks:
  aeon-quant-net:
    driver: bridge
