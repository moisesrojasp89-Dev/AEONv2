<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Terminal de Mercados Globales | AEON</title>
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />

  <!-- CSS -->
  <link rel="stylesheet" href="/src/css/variables.css" />
  <link rel="stylesheet" href="/src/css/reset.css" />
  <link rel="stylesheet" href="/src/css/layout.css" />
  <link rel="stylesheet" href="/src/css/animations.css" />
  <link rel="stylesheet" href="/src/css/components/buttons.css" />
  <link rel="stylesheet" href="/src/css/components/navbar.css" />
  <link rel="stylesheet" href="/src/css/components/market.css" />
  <link rel="stylesheet" href="/src/css/components/footer.css" />
  <link rel="stylesheet" href="/src/css/responsive.css" />
  
  <style>
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: var(--font-body);
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .bg-mesh {
      position: fixed;
      inset: 0;
      background: 
        radial-gradient(circle at 15% 25%, rgba(14, 165, 233, 0.08) 0%, transparent 35%),
        radial-gradient(circle at 85% 20%, rgba(139, 92, 246, 0.08) 0%, transparent 35%),
        radial-gradient(circle at 50% 75%, rgba(34, 197, 94, 0.04) 0%, transparent 40%),
        var(--bg);
      z-index: -1;
      pointer-events: none;
    }
    .main-content {
      flex: 1;
    }
  </style>
</head>
<body class="markets-body-locked">

  <div class="bg-mesh" aria-hidden="true"></div>

  <!-- Header & Navbar Global -->
  <div id="navbar-root"></div>

  <!-- Main Content: Terminal de Mercados -->
  <main class="main-content">
    <div class="markets-page-container">
      
      <!-- Hero de Sección Compacto y Elegante -->
      <section class="markets-hero-header">
        <div class="markets-hero-meta">
          <h1 class="markets-hero-title">Mercados Globales</h1>
          <span class="markets-hero-pill font-mono"><span class="pulse-dot"></span> 14 Activos en Vivo</span>
        </div>
        <p class="markets-hero-subtitle">
          Radar institucional en vivo: escáner de sesgos direccionales, flujos de sesión y catalizadores macro.
        </p>
      </section>

      <!-- Barra de Filtros y Controles -->
      <div class="markets-controls-bar">
        <div class="market-filters-pills">
          <button class="market-filter-pill active" data-category="ALL">Todos (14)</button>
          <button class="market-filter-pill" data-category="INDICES">⚡ Índices (4)</button>
          <button class="market-filter-pill" data-category="METALS">🪙 Metales (1)</button>
          <button class="market-filter-pill" data-category="CRYPTO">₿ Cripto (1)</button>
          <button class="market-filter-pill" data-category="FOREX">💶 Divisas & DXY (8)</button>
        </div>

        <div class="market-search-box">
          <span class="market-search-icon">🔍</span>
          <input type="text" id="market-search-input" placeholder="Buscar activo, ticker o tag..." />
        </div>
      </div>

      <!-- Indicador visual de swipe táctil en móvil -->
      <div class="markets-swipe-hint font-mono">
        <span>👈 Desliza activos en vivo 👉</span>
      </div>

      <!-- Grid / Carrusel Horizontal de Activos -->
      <div id="markets-grid" class="markets-grid-layout">
        <!-- Renderizado dinámico vía src/js/markets.js -->
      </div>

    </div>
  </main>

  <!-- Toast flotante de actualización en vivo -->
  <div id="market-live-toast" class="market-live-toast font-mono"></div>


  <!-- Footer -->
  <footer class="footer" role="contentinfo" style="margin-top: auto; border-top: 1px solid var(--border); padding: 2rem 0;">
    <div class="container footer-bottom" style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem;">
      <p class="footer-copy font-mono" style="font-size: 0.8rem; color: var(--muted-2);">© 2026 AEON Intelligence Platform. Todos los derechos reservados.</p>
      <div class="footer-legal-links" style="display: flex; gap: 1.5rem; font-size: 0.8rem;">
        <a href="/aviso-legal.html" style="color: var(--muted);">Aviso Legal</a>
        <a href="/privacidad.html" style="color: var(--muted);">Privacidad</a>
        <a href="/cookies.html" style="color: var(--muted);">Cookies</a>
      </div>
    </div>
  </footer>

  <!-- Scripts -->
  <script type="module" src="/src/js/markets.js"></script>

</body>
</html>
