<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AEON | Recuperar Contraseña</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="/src/css/variables.css">
  <link rel="stylesheet" href="/src/css/reset.css">
  <link rel="stylesheet" href="/src/css/layout.css">
  <link rel="stylesheet" href="/src/css/components/buttons.css">
  <link rel="stylesheet" href="/src/css/auth.css">
</head>
<body class="auth-body">
  <div class="bg-mesh" aria-hidden="true"></div>

  <div class="auth-container">
    <header class="auth-header">
      <a href="/index.html" class="logo" aria-label="Volver a Inicio">
        <img src="/AEON.png" alt="AEON" class="auth-logo-img" />
      </a>
      <h1>Recuperar Contraseña</h1>
      <p>Ingresa tu correo para recibir un enlace de restablecimiento seguro.</p>
    </header>

    <form id="recover-form" class="auth-form" novalidate>
      <div id="auth-error" class="auth-error" role="alert" aria-live="assertive" hidden></div>
      <div id="auth-success" class="auth-success" role="status" aria-live="polite" hidden></div>
      
      <div class="form-group">
        <label for="email">Correo electrónico registrado</label>
        <input type="email" id="email" name="email" placeholder="tu@correo.com" required autocomplete="email">
      </div>
      
      <button type="submit" id="btn-recover" class="btn btn-primary btn-block">Enviar Enlace</button>
    </form>

    <div class="auth-footer">
      <p>¿Recordaste tu contraseña? <a href="/login.html">Volver a Iniciar Sesión</a></p>
    </div>
  </div>

  <script type="module" src="/src/js/auth.js"></script>
</body>
</html>
